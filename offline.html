<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Offline – Familienbuch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f7a74">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="appbar"><h1 class="appbar__title">Familienbuch</h1></header>
  <main class="view">
    <section class="card">
      <div class="card__body">
        <div class="empty">
          <strong>Gerade offline</strong>
          <p>Die App konnte nicht geladen werden. Sobald wieder eine Verbindung besteht, funktioniert alles wie gewohnt.</p>
        </div>
        <div class="actions">
          <button class="btn btn--block" type="button" onclick="location.reload()">Erneut versuchen</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
