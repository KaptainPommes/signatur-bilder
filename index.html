<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Familienbuch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Wichtige Daten der Familie – immer griffbereit.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f7a74" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d2b2b" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="same-origin">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- iOS: Standalone-Modus, Statusleiste, Name unter dem Home-Bildschirm-Symbol -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Familie">
  <meta name="format-detection" content="telephone=no">

  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="skip-link" href="#view">Zum Inhalt springen</a>

  <header class="appbar">
    <button class="iconbtn" id="btn-back" type="button" hidden aria-label="Zurück">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h1 class="appbar__title" id="appbar-title">Familienbuch</h1>
    <button class="iconbtn" id="btn-theme" type="button" aria-label="Farbschema wechseln">◐</button>
    <button class="iconbtn" id="btn-menu" type="button" hidden aria-label="Menü öffnen">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/>
      </svg>
    </button>
  </header>

  <div class="offline-bar" id="offline-bar" role="status" hidden>
    Keine Internetverbindung.
  </div>

  <main id="view" class="view" tabindex="-1">
    <p class="loading">Wird geladen …</p>
  </main>

  <!-- iOS zeigt keinen eigenen Installationsdialog – dort hilft nur die Anleitung. -->
  <div class="banner" id="install-hint" hidden>
    <p id="install-hint-text"></p>
    <button type="button" id="install-action" class="banner__btn" hidden>Installieren</button>
    <button type="button" id="install-dismiss" class="banner__close" aria-label="Hinweis schließen">✕</button>
  </div>

  <div class="banner" id="update-banner" hidden>
    <p>Eine neue Version ist bereit.</p>
    <button type="button" id="update-action" class="banner__btn">Aktualisieren</button>
  </div>

  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
