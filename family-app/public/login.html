<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Familienbuch – Anmelden</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Karla:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-mark"><span class="dot"></span><span class="brand">Familienbuch</span></div>
      <h1>Willkommen zurück</h1>
      <p class="auth-sub">Meldet euch an, um eure Familiendaten zu sehen und zu bearbeiten.</p>
      <div id="error" class="error-banner" hidden></div>
      <form id="login-form">
        <div class="field">
          <label for="username">Benutzername</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Passwort</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn btn-primary" type="submit">Anmelden</button>
      </form>
    </div>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
